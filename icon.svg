  <path d="M 206 60 L 216 50 M 206 50 L 216 60" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
  <path d="M 40 196 L 50 206 M 40 206 L 50 196" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
  <path d="M 206 196 L 216 206 M 206 206 L 216 196" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
